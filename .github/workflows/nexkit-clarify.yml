# Managed by NexKit 0.1.0-rc.1; update through nexkit install.
name: NexKit clarify
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pipeline:
        type: string
        required: true
        default: maintenance
      issue:
        description: Release candidate issue number
        required: true
        type: string
permissions: {}
jobs:
  nexkit:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request }}
    uses: phuongnse/nexkit/.github/workflows/clarify.yml@ace93ccb318091e2722042b2ac6e0f19b509ae3f
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
      actions: write
    with:
      kit_repository: phuongnse/nexkit
      kit_ref: ace93ccb318091e2722042b2ac6e0f19b509ae3f
      pipeline: maintenance
