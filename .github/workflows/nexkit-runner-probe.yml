name: NexKit runner admission probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nexkit-runner-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, nexkit-validation-existing]
    timeout-minutes: 3
    # This branch forges an admitted context; the host hook must still reject it.
    env:
      GITHUB_REPOSITORY: phuongnse/nexkit-validation-existing
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_WORKFLOW_REF: phuongnse/nexkit-validation-existing/.github/workflows/nexkit-runner-probe.yml@refs/heads/main
    steps:
      - name: Marker proves whether workflow steps were admitted
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/nexkit-admission-marker').write_text('workflow step executed')
          print('NEXKIT_WORKFLOW_STEP_EXECUTED')
          PY
      - name: Inspect installed tools without model or account access
        run: |
          codex --version
          gh --version
          python3 --version
